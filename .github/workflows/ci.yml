name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL }}
  OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
  AUTH_DOMAIN_PREFIX: ${{ vars.AUTH_DOMAIN_PREFIX }}
  SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
  HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}

jobs:
  # Required status check on main (D-013).
  ci:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Environment-agnostic synth: no AWS credentials on PRs.
      - run: pnpm --filter infra synth

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # No `environment:` here: it changes the OIDC `sub` claim and breaks the role trust (D-016).
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy SiteStack and PrivateAreaStack
        run: pnpm --filter infra exec cdk deploy SiteStack PrivateAreaStack --require-approval never --outputs-file cdk-outputs.json
      - name: Smoke test
        run: |
          for key in DistributionUrl SiteUrl; do
            url=$(jq -r ".SiteStack.$key // empty" infra/cdk-outputs.json)
            [ -z "$url" ] && continue
            for path in / /about/ /projects/ /projects/portfolio-site/; do
              curl -fsS -o /dev/null --retry 5 --retry-delay 10 --retry-all-errors "$url$path"
            done
            echo "Live at $url" >> "$GITHUB_STEP_SUMMARY"
          done
